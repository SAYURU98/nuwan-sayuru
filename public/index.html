<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="author" content="Nuwan Sayuru">
<meta name="description" content="Nuwan Sayuru, Field Services Engineer at Huawei Technologies Lanka. Implementation, POCs and support across data centre, storage, SD-WAN, campus networks and GPON.">
<meta property="og:title" content="Nuwan Sayuru">
<meta property="og:description" content="Implementation, POCs and support across data centre, storage, SD-WAN, campus networks and GPON.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' x2='1'%3E%3Cstop offset='0' stop-color='%23ffb300'/%3E%3Cstop offset='.5' stop-color='%23ff3d1f'/%3E%3Cstop offset='1' stop-color='%23d62bff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='42' font-family='Arial Black,Arial' font-weight='900' font-size='26' text-anchor='middle'%3ENS%3C/text%3E%3C/svg%3E">
<title>Nuwan Sayuru</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,100..900&family=Schibsted+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one fixed WebGL particle field behind a hash-routed multi-page app. The cloud re-forms
   into a new shape on every page: name, sphere, lattice, knot, ring, wave. Warm neon on black. */
:root{
  --bg:#000000;
  --panel:#100a0c;
  --line:#2e2226;
  --text:#fff4ea;
  --dim:#bfaea9;
  --gold:#ffb300;      /* warm saturated yellow */
  --ember:#ff3d1f;     /* warm red */
  --magenta:#d62bff;   /* warm purple */
  --violet:#7a2bff;    /* deep purple for depth */
  --heat:linear-gradient(100deg,var(--gold),var(--ember) 48%,var(--magenta));
  --f-display:"Anybody","Arial Black",system-ui,sans-serif;
  --f-body:"Schibsted Grotesk","Helvetica Neue",Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --gut:clamp(16px,4vw,56px);
  --max:1240px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--text);font-family:var(--f-body);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}
#field{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
#app{position:relative;z-index:1}
.wrap{max-width:var(--max);margin-inline:auto;padding-inline:var(--gut)}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:.95;text-wrap:balance}
p{margin:0}
.grad{background:var(--heat);-webkit-background-clip:text;background-clip:text;color:transparent}
.glass{background:color-mix(in srgb,var(--panel) 72%,transparent);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);border:1px solid var(--line)}

/* nav */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--f-display);font-weight:800;font-variation-settings:"wdth" 140;font-size:15px;letter-spacing:.04em}
.logo b{width:30px;height:30px;border-radius:9px;background:var(--heat);display:grid;place-items:center;color:#000;font-size:13px;font-variation-settings:"wdth" 150}
.links{display:flex;gap:4px;padding:5px;border-radius:999px}
.links a{text-decoration:none;font-size:14.5px;padding:8px 14px;border-radius:999px;color:var(--dim);transition:color .2s,background .2s}
.links a:hover{color:var(--text)}
.links a.on{background:var(--text);color:#000;font-weight:600}
.menu{display:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:9px 16px;cursor:pointer}
.cvbtn{text-decoration:none;font-weight:700;font-size:14px;padding:10px 18px;border-radius:999px;background:var(--heat);color:#000;white-space:nowrap}
@media (max-width:900px){
  .links{position:absolute;top:100%;left:var(--gut);right:var(--gut);flex-direction:column;border-radius:20px;padding:10px;display:none}
  .links.open{display:flex}
  .links a{padding:12px 16px}
  .menu{display:block}
}

/* page frame */
.page{padding-block:clamp(28px,5vw,64px) clamp(64px,8vw,120px)}
.kicker{display:inline-flex;align-items:center;gap:10px;font-size:14px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 8px}
.kicker i{width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px var(--gold);animation:blink 2s infinite}
@keyframes blink{50%{opacity:.35}}
.title{font-size:clamp(46px,8.4vw,128px);font-weight:900;font-variation-settings:"wdth" 120;text-transform:uppercase;letter-spacing:-.01em;margin-top:18px}
.sub{max-width:52ch;color:var(--dim);font-size:clamp(17px,1.6vw,20px);margin-top:18px}
.block{margin-top:clamp(56px,8vw,112px)}
.h2{font-size:clamp(30px,4.2vw,56px);font-weight:850;font-variation-settings:"wdth" 110;text-transform:uppercase}
.h2+p{color:var(--dim);margin-top:10px;max-width:56ch}

/* hero */
.hero{min-height:calc(100svh - 70px);display:grid;align-content:end;padding-bottom:clamp(28px,5vw,56px)}
.hero h1{font-size:clamp(20px,2.2vw,28px);font-family:var(--f-body);font-weight:500;line-height:1.35;max-width:30ch;margin-top:18px}
.hero h1 b{font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
.btn{position:relative;display:inline-flex;align-items:center;gap:10px;padding:15px 24px;border-radius:999px;font-weight:700;font-size:15px;text-decoration:none;border:1.5px solid var(--text);background:transparent;cursor:pointer;transition:background .25s,color .25s,box-shadow .25s;will-change:transform}
.btn.hot{background:var(--heat);border-color:transparent;color:#000;box-shadow:0 10px 40px -10px var(--ember)}
.btn.hot:hover{box-shadow:0 14px 60px -8px var(--magenta)}
.btn.line:hover{background:var(--text);color:#000}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.hint{margin-top:22px;font-size:13px;color:var(--dim);display:flex;align-items:center;gap:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.fallname{display:none;font-family:var(--f-display);font-weight:900;font-variation-settings:"wdth" 125;font-size:clamp(56px,11vw,150px);line-height:.85;text-transform:uppercase;background:var(--heat);-webkit-background-clip:text;background-clip:text;color:transparent}
.nogl .fallname{display:block}
@media (pointer:coarse){.hint{display:none}.tbtn{width:44px;height:44px;opacity:.8}}
.hint kbd{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-bottom-width:3px;border-radius:6px;padding:1px 7px;color:var(--text)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));border-radius:26px;overflow:hidden}
.stat{padding:26px 22px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0}
.stat b{display:block;font-family:var(--f-display);font-weight:900;font-variation-settings:"wdth" 82;font-size:clamp(32px,3.6vw,52px);white-space:nowrap;line-height:1;font-variant-numeric:tabular-nums}
.stat span{display:block;margin-top:10px;color:var(--dim);font-size:14.5px;line-height:1.35}

/* services */
.svc{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px;margin-top:28px}
.svc div{padding:22px;border-radius:20px;min-width:0}
.svc h3{font-family:var(--f-body);font-size:19px;font-weight:700;line-height:1.25}
.svc p{color:var(--dim);margin-top:8px;font-size:15.5px}
.svc .ix{font-family:var(--f-mono);font-size:12px;color:var(--gold);margin-bottom:12px;display:block}

/* domains: glow cards with tilt */
.doms{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px;margin-top:28px}
.dom{position:relative;border-radius:24px;padding:26px;min-height:220px;overflow:hidden;transform-style:preserve-3d;transition:transform .2s ease-out;isolation:isolate}
.dom::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;background:conic-gradient(from var(--a,0deg),transparent 0 70%,var(--c1) 80%,var(--c2) 90%,transparent);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.0;transition:opacity .4s;z-index:-1}
.dom:hover::before,.dom:focus-within::before{opacity:1;animation:spin 3s linear infinite}
@property --a{syntax:"<angle>";initial-value:0deg;inherits:false}
@keyframes spin{to{--a:360deg}}
.dom::after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;left:var(--mx,50%);top:var(--my,50%);translate:-50% -50%;background:radial-gradient(circle,color-mix(in srgb,var(--c1) 30%,transparent),transparent 65%);opacity:0;transition:opacity .3s;z-index:-1;pointer-events:none}
.dom:hover::after{opacity:1}
.dom h3{font-size:26px;font-weight:850;font-variation-settings:"wdth" 115;text-transform:uppercase;line-height:1}
.dom p{color:var(--dim);margin-top:12px;font-size:15.5px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.tags span{font-size:12.5px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--text);background:#ffffff08}

/* marquee */
.marq{overflow:hidden;border-block:1px solid var(--line);padding-block:18px;margin-top:clamp(56px,8vw,112px);mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.marq div{display:flex;gap:48px;width:max-content;animation:slide 40s linear infinite}
.marq span{font-family:var(--f-display);font-weight:800;font-variation-settings:"wdth" 130;font-size:clamp(22px,3vw,38px);text-transform:uppercase;white-space:nowrap;color:transparent;-webkit-text-stroke:1px var(--dim)}
.marq span:nth-child(3n+1){-webkit-text-stroke:0;color:var(--gold)}
@keyframes slide{to{transform:translateX(-50%)}}

/* highlights */
.hl{display:grid;gap:12px;margin-top:28px}
.hl details{border-radius:20px;overflow:hidden}
.hl summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;align-items:center;padding:22px 24px}
.hl summary::-webkit-details-marker{display:none}
.hl summary .n{font-family:var(--f-display);font-weight:900;font-variation-settings:"wdth" 100;font-size:clamp(28px,3.4vw,44px);line-height:1;min-width:3.2ch}
.hl summary h3{font-family:var(--f-body);font-weight:700;font-size:clamp(18px,1.8vw,22px);line-height:1.25}
.hl summary small{display:block;color:var(--dim);font-size:14px;font-weight:400;margin-top:2px}
.hl summary .pm{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;transition:transform .3s,background .3s}
.hl details[open] .pm{transform:rotate(45deg);background:var(--text);color:#000}
.hl .body{padding:0 24px 24px;color:#e9ddd8;max-width:80ch}
@media (max-width:560px){.hl summary{grid-template-columns:minmax(0,1fr) auto}.hl summary .n{grid-column:1/-1}}

/* timeline */
.tl{display:grid;gap:12px;margin-top:28px}
.tl div{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr);gap:8px 24px;padding:22px 24px;border-radius:20px}
.tl time{font-family:var(--f-mono);font-size:14px;color:var(--gold)}
.tl h3{font-family:var(--f-body);font-size:20px;font-weight:700;line-height:1.3}
.tl p{color:var(--dim);margin-top:4px}
@media (max-width:640px){.tl div{grid-template-columns:1fr}}

/* credentials */
.creds{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:12px;margin-top:28px}
.cred{padding:24px;border-radius:22px;min-width:0;position:relative;overflow:hidden}
.cred .big{font-family:var(--f-display);font-weight:900;font-variation-settings:"wdth" 120;font-size:30px;text-transform:uppercase;line-height:1}
.cred p{color:var(--dim);margin-top:10px;font-size:15px}
.cred small{display:block;font-family:var(--f-mono);font-size:12px;color:var(--gold);margin-bottom:12px}
.cred.star{background:radial-gradient(120% 100% at 100% 0%,color-mix(in srgb,var(--magenta) 40%,transparent),transparent 60%),radial-gradient(100% 100% at 0% 100%,color-mix(in srgb,var(--ember) 35%,transparent),transparent 60%),var(--panel)}

/* github */
.repos{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px;margin-top:28px}
.repo{display:flex;flex-direction:column;gap:10px;padding:22px;border-radius:20px;text-decoration:none;min-width:0;transition:transform .25s,border-color .25s}
.repo:hover{transform:translateY(-4px);border-color:var(--gold)}
.repo h3{font-family:var(--f-mono);font-size:17px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.repo p{color:var(--dim);font-size:15px;flex:1}
.repo .meta{display:flex;gap:14px;font-size:13px;color:var(--dim)}
.repo .meta i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.ghcard{display:flex;flex-wrap:wrap;align-items:center;gap:18px;padding:22px;border-radius:22px;margin-top:28px}
.ghcard .who{font-family:var(--f-mono);font-size:18px;font-weight:600}
.ghcard p{color:var(--dim);font-size:15px}
.ghcard .sp{flex:1;min-width:200px}

/* forms */
.grid2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:clamp(16px,3vw,32px);margin-top:28px;align-items:start}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.card{padding:clamp(20px,3vw,32px);border-radius:24px;min-width:0}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-size:14px;color:var(--dim)}
.field input,.field select,.field textarea{width:100%;background:#00000080;border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--text);font:inherit;font-size:16px}
.field textarea{min-height:130px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 25%,transparent)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.split{grid-template-columns:1fr}}
.seg{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.seg button{padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--text);color:#000;border-color:var(--text);font-weight:600}
.note{font-size:14px;color:var(--dim);margin-top:12px}
.ok{color:#ffd28a}
.err{color:#ff8a78}
.cline{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 18px;border-radius:16px;border:1px solid var(--line);background:#00000066;margin-bottom:10px}
.cline small{display:block;color:var(--dim);font-size:13px}
.cline .v{font-weight:600;overflow-wrap:anywhere;user-select:all}
.cline > div{min-width:0}
.mini{padding:8px 14px;border-radius:999px;border:1px solid var(--text);background:transparent;cursor:pointer;font-size:13px;font-weight:600;text-decoration:none;flex-shrink:0}

/* endorsements wall */
.wall{columns:3 280px;column-gap:14px;margin-top:20px}
.quote{break-inside:avoid;margin-bottom:14px;padding:22px;border-radius:20px}
.quote p{font-size:16px}
.quote footer{margin-top:14px;font-size:14px;color:var(--dim)}
.quote footer b{color:var(--text);display:block;font-weight:600}
.empty{padding:30px;border-radius:20px;border:1px dashed var(--line);color:var(--dim);text-align:center}

/* games */
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:16px;margin-top:28px}
.game{padding:22px;border-radius:24px;min-width:0}
.game h3{font-size:28px;font-weight:900;font-variation-settings:"wdth" 120;text-transform:uppercase}
.game .rule{color:var(--dim);font-size:15px;margin-top:6px}
.hud{display:flex;gap:16px;margin:16px 0;font-family:var(--f-mono);font-size:14px;color:var(--dim)}
.hud b{color:var(--gold);font-weight:600}
.q{font-family:var(--f-mono);font-size:clamp(18px,2.2vw,24px);padding:18px;border-radius:14px;background:#00000080;border:1px solid var(--line);text-align:center}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.opts button{font-family:var(--f-mono);font-size:15px;padding:14px 10px;border-radius:12px;border:1px solid var(--line);background:#ffffff08;cursor:pointer;transition:background .2s,border-color .2s}
.opts button:hover{border-color:var(--gold)}
.opts button.right{background:color-mix(in srgb,var(--gold) 30%,transparent);border-color:var(--gold)}
.opts button.wrong{background:color-mix(in srgb,var(--ember) 30%,transparent);border-color:var(--ember)}
.board{display:grid;gap:4px;margin-inline:auto;max-width:420px;aspect-ratio:1;padding:6px;border-radius:14px;background:#00000080;border:1px solid var(--line)}
.tile{border:0;background:#ffffff06;border-radius:8px;cursor:pointer;padding:0;position:relative}
.tile svg{width:100%;height:100%;display:block;transition:transform .18s}
.tile.lit path{stroke:var(--gold);filter:drop-shadow(0 0 4px var(--gold))}
.tile.end{background:color-mix(in srgb,var(--magenta) 22%,transparent)}
.done{margin-top:12px;font-weight:600;color:var(--gold);text-align:center;min-height:1.6em}

/* cv */
.cvbox{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:18px;padding:26px;border-radius:24px;margin-top:28px;background:radial-gradient(90% 140% at 0% 0%,color-mix(in srgb,var(--gold) 26%,transparent),transparent 60%),radial-gradient(90% 140% at 100% 100%,color-mix(in srgb,var(--magenta) 30%,transparent),transparent 60%),var(--panel)}
.cvbox h3{font-size:clamp(26px,3vw,38px);font-weight:900;font-variation-settings:"wdth" 115;text-transform:uppercase}
.cvbox p{color:var(--dim);margin-top:6px}

/* admin */
.tabsx{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}
.item{padding:16px;border-radius:16px;border:1px solid var(--line);margin-bottom:10px;background:#00000066}
.item .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.code{font-family:var(--f-mono);font-size:13px;width:100%;min-height:420px;background:#000;border:1px solid var(--line);border-radius:12px;color:var(--text);padding:14px}

/* footer */
.foot{border-top:1px solid var(--line);color:var(--dim);font-size:14px}
.foot .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;padding-block:24px}
.foot a{text-decoration:none}

/* network route transition */
#route{position:fixed;inset:0;width:100%;height:100%;z-index:60;pointer-events:none;opacity:0;transition:opacity .22s}
#route.on{opacity:1}
.routetag{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));translate:-50% 0;z-index:61;font-family:var(--f-mono);font-size:13px;color:var(--text);padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:#000c;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.routetag.on{opacity:1}
.routetag b{color:var(--gold);font-weight:600}

/* horizon grid under the hero */
.horizon{position:fixed;left:-20%;right:-20%;bottom:-6vh;height:46vh;z-index:0;pointer-events:none;perspective:420px;opacity:.55;transition:opacity .6s;mask-image:linear-gradient(to top,#000 10%,transparent 85%)}
.horizon i{position:absolute;inset:0;transform:rotateX(62deg);transform-origin:50% 100%;background-image:linear-gradient(90deg,color-mix(in srgb,var(--magenta) 55%,transparent) 1px,transparent 1px),linear-gradient(0deg,color-mix(in srgb,var(--ember) 55%,transparent) 1px,transparent 1px);background-size:64px 64px;animation:floor 2.6s linear infinite}
.horizon::after{content:"";position:absolute;left:0;right:0;bottom:46%;height:2px;background:var(--heat);filter:blur(1px);box-shadow:0 0 30px 6px color-mix(in srgb,var(--ember) 50%,transparent)}
.horizon.dim{opacity:.18}
@keyframes floor{to{background-position:0 64px,0 64px}}

/* reveal on scroll: starts visible, sharpens in */
.rv{transition:transform .9s cubic-bezier(.2,.8,.2,1),filter .9s,opacity .9s}
.rv.pre{transform:translateY(26px) scale(.985);filter:blur(6px);opacity:.25}

/* mini topology inside domain cards */
.topo{position:absolute;right:14px;top:14px;width:120px;height:80px;opacity:.85}
.topo line{stroke:var(--line);stroke-width:1.4}
.topo .flow{stroke:var(--c1);stroke-width:2;stroke-dasharray:6 120;animation:flow 2.4s linear infinite}
.topo .flow.b{stroke:var(--c2);animation-delay:-1.2s;animation-duration:3s}
.topo circle{fill:#000;stroke:var(--c1);stroke-width:1.6}
.topo circle.hub{fill:var(--c1);stroke:none}
@keyframes flow{to{stroke-dashoffset:-126}}
.dom h3,.dom p{max-width:calc(100% - 110px)}
@media (max-width:420px){.dom h3,.dom p{max-width:none}.topo{position:relative;right:auto;top:auto;margin-bottom:8px}}

/* photo */
.me{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.me img{width:84px;height:84px;border-radius:50%;object-fit:cover;border:2px solid transparent;background:var(--heat) border-box;padding:3px;box-shadow:0 0 40px -6px var(--magenta)}
.shimmer{background:linear-gradient(100deg,var(--gold),var(--ember) 30%,var(--magenta) 50%,var(--ember) 70%,var(--gold));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 6s linear infinite}
@keyframes sh{to{background-position:-200% 0}}

/* terminal */
.term{position:fixed;right:var(--gut);bottom:calc(var(--gut) + env(safe-area-inset-bottom,0px));z-index:55;width:min(560px,calc(100vw - 2*var(--gut)));border-radius:18px;overflow:hidden;font-family:var(--f-mono);font-size:14px;box-shadow:0 30px 80px -20px #000}
.term header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);font-size:12px;color:var(--dim)}
.term header span i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.term .out{height:260px;overflow:auto;padding:12px 14px;white-space:pre-wrap;line-height:1.55}
.term .out .c{color:var(--gold)}
.term form{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.term input{flex:1;background:transparent;border:0;color:var(--text);font:inherit;outline:none;min-width:0}
.tbtn{position:fixed;right:var(--gut);bottom:calc(var(--gut) + env(safe-area-inset-bottom,0px));z-index:54;width:52px;height:52px;border-radius:16px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-family:var(--f-mono);font-weight:600;color:var(--gold)}

.preview-flag{font-size:13px;color:#ffd28a;border:1px dashed #ffd28a66;border-radius:12px;padding:10px 14px;margin-top:14px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.global.prod.js"></script>
<script>
(()=>{
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* =========================================================
   1. Particle field: one cloud that re-forms per page
   ========================================================= */
const Field = (()=>{
  const canvas = document.getElementById('field');
  let ok = !!window.THREE;
  try{ if(ok){ const t=document.createElement('canvas'); ok = !!(t.getContext('webgl')||t.getContext('experimental-webgl')); } }catch(e){ ok=false; }
  if(!ok){ document.documentElement.classList.add('nogl'); canvas.style.background='radial-gradient(60% 50% at 70% 30%,#d62bff33,transparent),radial-gradient(50% 50% at 20% 80%,#ff3d1f33,transparent)'; return {to(){},}; }
  const small = innerWidth < 760;
  const N = small ? 3800 : 8000;
  const renderer = new THREE.WebGLRenderer({canvas, antialias:false, alpha:true, powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));
  const scene = new THREE.Scene();
  const cam = new THREE.PerspectiveCamera(50, 1, 0.1, 400);
  cam.position.set(0,0,90);
  const pos = new Float32Array(N*3), tgt = new Float32Array(N*3), col = new Float32Array(N*3), seed = new Float32Array(N);
  const palette = [new THREE.Color('#ffb300'),new THREE.Color('#ff3d1f'),new THREE.Color('#d62bff'),new THREE.Color('#7a2bff')];
  for(let i=0;i<N;i++){ pos[i*3]=(Math.random()-.5)*300; pos[i*3+1]=(Math.random()-.5)*200; pos[i*3+2]=(Math.random()-.5)*200; seed[i]=Math.random(); }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  geo.setAttribute('color', new THREE.BufferAttribute(col,3));
  geo.setAttribute('seed', new THREE.BufferAttribute(seed,1));
  const mat = new THREE.ShaderMaterial({
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, vertexColors:true,
    uniforms:{uTime:{value:0}, uSize:{value: small?3.4:3.0}, uPR:{value:renderer.getPixelRatio()}},
    vertexShader:`attribute float seed; varying vec3 vC; varying float vA; uniform float uTime,uSize,uPR;
      void main(){ vC=color; vec4 mv=modelViewMatrix*vec4(position,1.); gl_Position=projectionMatrix*mv;
      float tw=.65+.35*sin(uTime*2.+seed*40.); vA=tw; gl_PointSize=uSize*uPR*(70./-mv.z)*(.7+seed*.8); }`,
    fragmentShader:`varying vec3 vC; varying float vA; void main(){ vec2 p=gl_PointCoord-.5; float d=length(p); if(d>.5) discard;
      float g=smoothstep(.5,0.,d); gl_FragColor=vec4(vC*2.1, min(1.,g*1.15)*vA); }`
  });
  const pts = new THREE.Points(geo, mat); scene.add(pts);

  function colorize(mode){
    for(let i=0;i<N;i++){
      const x=tgt[i*3], y=tgt[i*3+1];
      let t = mode==='text' ? (x+60)/120 : (Math.atan2(y,x)/Math.PI+1)/2;
      t = Math.min(.999,Math.max(0,t + (seed[i]-.5)*.18));
      const k=t*3, a=palette[Math.floor(k)], b=palette[Math.min(3,Math.floor(k)+1)], f=k-Math.floor(k);
      col[i*3]=a.r+(b.r-a.r)*f; col[i*3+1]=a.g+(b.g-a.g)*f; col[i*3+2]=a.b+(b.b-a.b)*f;
    }
    geo.attributes.color.needsUpdate=true;
  }
  /* shape generators */
  const shapes = {
    text(){
      const fam='"Anybody","Arial Black",sans-serif', fs=small?190:200, lines=small?['NUWAN','SAYURU']:['NUWAN SAYURU'];
      const m=document.createElement('canvas').getContext('2d'); m.font=`900 ${fs}px ${fam}`;
      const tw=Math.max(...lines.map(l=>m.measureText(l).width)), w=Math.ceil(tw)+80, lh=fs*1.02, h=Math.ceil(lh*lines.length)+60;
      const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d');
      x.font=`900 ${fs}px ${fam}`; x.fillStyle='#fff'; x.textAlign='center'; x.textBaseline='middle';
      lines.forEach((l,i)=>x.fillText(l,w/2,30+lh*(i+.5)));
      const d=x.getImageData(0,0,w,h).data, cand=[];
      for(let yy=0;yy<h;yy+=3)for(let xx=0;xx<w;xx+=3) if(d[(yy*w+xx)*4+3]>128) cand.push([xx,yy]);
      const visW=2*Math.tan(25*Math.PI/180)*90*(innerWidth/innerHeight), sc=(visW*(small?.84:.8))/tw;
      for(let i=0;i<N;i++){ const p=cand[(Math.random()*cand.length)|0]||[w/2,h/2];
        tgt[i*3]=(p[0]-w/2)*sc+(Math.random()-.5)*.3; tgt[i*3+1]=-(p[1]-h/2)*sc+(small?9:11)+(Math.random()-.5)*.3; tgt[i*3+2]=(Math.random()-.5)*4; }
      return 'text';
    },
    sphere(){ const R=small?24:30; for(let i=0;i<N;i++){ const u=Math.random()*2-1, th=Math.random()*Math.PI*2, r=R*(i%6===0?1.35:1);
      const s=Math.sqrt(1-u*u); tgt[i*3]=r*s*Math.cos(th)+(small?0:26); tgt[i*3+1]=r*u; tgt[i*3+2]=r*s*Math.sin(th);} return 'radial'; },
    lattice(){ const n=Math.round(Math.cbrt(N)), g=small?2.6:3.2, o=(n-1)*g/2; for(let i=0;i<N;i++){ const a=i%n,b=Math.floor(i/n)%n,c=Math.floor(i/(n*n))%n;
      tgt[i*3]=a*g-o+(small?0:24); tgt[i*3+1]=b*g-o; tgt[i*3+2]=c*g-o;} return 'radial'; },
    knot(){ const p=2,q=3,R=small?14:18,r=small?5.5:7; for(let i=0;i<N;i++){ const t=i/N*Math.PI*2*1, ph=Math.random()*Math.PI*2;
      const cx=(R+r*Math.cos(q*t))*Math.cos(p*t), cy=(R+r*Math.cos(q*t))*Math.sin(p*t), cz=r*Math.sin(q*t);
      const tube=2.2*Math.sqrt(Math.random()); tgt[i*3]=cx+tube*Math.cos(ph)+(small?0:24); tgt[i*3+1]=cy+tube*Math.sin(ph); tgt[i*3+2]=cz+tube*Math.cos(ph*1.3);} return 'radial'; },
    ring(){ for(let i=0;i<N;i++){ const a=Math.random()*Math.PI*2, band=Math.random(); const r=(small?18:24)+band*(small?10:14)+Math.sin(a*6)*1.5;
      tgt[i*3]=Math.cos(a)*r+(small?0:24); tgt[i*3+1]=Math.sin(a)*r*.9; tgt[i*3+2]=(Math.random()-.5)*6;} return 'radial'; },
    wave(){ const cols=Math.round(Math.sqrt(N*2)), rows=Math.ceil(N/cols), gx=small?.9:1.4, gz=small?1.4:1.8; for(let i=0;i<N;i++){ const a=i%cols,b=Math.floor(i/cols);
      tgt[i*3]=(a-cols/2)*gx; tgt[i*3+2]=(b-rows/2)*gz; tgt[i*3+1]=-14;} return 'wave'; }
  };
  let mode='text', shape='text', t0=performance.now();
  const mouse=new THREE.Vector2(0,0), mw=new THREE.Vector3(999,999,0); let rotY=0, burst=0;
  function to(name){ if(!shapes[name]) name='sphere'; shape=name; mode=shapes[name](); colorize(mode==='text'?'text':'radial'); if(reduce){ pos.set(tgt); geo.attributes.position.needsUpdate=true; } }
  function resize(){ const w=innerWidth,h=innerHeight; renderer.setSize(w,h,false); cam.aspect=w/h; cam.updateProjectionMatrix(); }
  addEventListener('resize',()=>{resize(); clearTimeout(window.__rt); window.__rt=setTimeout(()=>to(shape),200);}); resize();
  addEventListener('pointermove',e=>{ mouse.x=e.clientX/innerWidth*2-1; mouse.y=-(e.clientY/innerHeight)*2+1;
    mw.set(mouse.x,mouse.y,.5).unproject(cam); const dir=mw.sub(cam.position).normalize(); const dist=-cam.position.z/dir.z; mw.copy(cam.position).add(dir.multiplyScalar(dist)); });
  addEventListener('pointerdown',e=>{ if(e.target===document.body||e.target.closest('.hero')) burst=1; });
  let scrollY=0; addEventListener('scroll',()=>{scrollY=window.scrollY},{passive:true});
  function loop(now){
    const t=(now-t0)/1000; mat.uniforms.uTime.value=t;
    const ease = burst>0 ? .02 : .06; burst*=.96; if(burst<.01) burst=0;
    for(let i=0;i<N;i++){
      const j=i*3; let tx=tgt[j], ty=tgt[j+1], tz=tgt[j+2];
      if(mode==='wave'){ ty=-14+Math.sin(tx*.18+t*1.4)*2.4+Math.cos(tz*.22+t)*2.2; }
      const n=Math.sin(t*.8+seed[i]*30)*.35; tx+=n; ty+=Math.cos(t*.7+seed[i]*20)*.35;
      if(burst>0){ tx+= (seed[i]-.5)*160*burst; ty+=(Math.sin(seed[i]*99)-.0)*90*burst; tz+=(Math.cos(seed[i]*77))*120*burst; }
      pos[j]+=(tx-pos[j])*ease; pos[j+1]+=(ty-pos[j+1])*ease; pos[j+2]+=(tz-pos[j+2])*ease;
      const dx=pos[j]-mw.x, dy=pos[j+1]-mw.y, d2=dx*dx+dy*dy;
      if(d2<90){ const f=(90-d2)/90*1.6; pos[j]+=dx*f*.08; pos[j+1]+=dy*f*.08; pos[j+2]+=f*.6; }
    }
    geo.attributes.position.needsUpdate=true;
    rotY += mode==='text' ? 0 : .0025;
    pts.rotation.y = mode==='text' ? Math.sin(t*.3)*.08 + mouse.x*.12 : rotY + mouse.x*.2;
    pts.rotation.x = mode==='wave' ? .35 : mouse.y*.12;
    pts.position.y = scrollY*0.02;
    pts.material.opacity = 1;
    renderer.render(scene,cam);
    if(!reduce) requestAnimationFrame(loop);
  }
  const start=()=>{ to(shape); if(reduce) loop(performance.now()); else requestAnimationFrame(loop); };
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(start);
  return {to, burst(){burst=1}, get shape(){return shape}};
})();

/* =========================================================
   2. Interaction: magnetic buttons, card tilt, route transition, reveals
   ========================================================= */
addEventListener('pointermove',e=>{
  if(reduce||e.pointerType!=='mouse') return;
  const cx=e.clientX, cy=e.clientY;
  const mb=e.target.closest&&e.target.closest('.btn'); document.querySelectorAll('.btn').forEach(b=>{ if(b!==mb) b.style.transform=''; });
  if(mb){const r=mb.getBoundingClientRect();mb.style.transform=`translate(${(cx-r.left-r.width/2)*.15}px,${(cy-r.top-r.height/2)*.25}px)`;}
  const card=e.target.closest&&e.target.closest('.dom'); if(card){const r=card.getBoundingClientRect(),px=(cx-r.left)/r.width,py=(cy-r.top)/r.height;
    card.style.setProperty('--mx',px*100+'%');card.style.setProperty('--my',py*100+'%');card.style.transform=`perspective(900px) rotateX(${(.5-py)*7}deg) rotateY(${(px-.5)*9}deg)`;}
});
document.addEventListener('pointerout',e=>{const c=e.target.closest&&e.target.closest('.dom'); if(c&&!c.contains(e.relatedTarget)) c.style.transform='';});

/* Route transition: a packet is routed hop by hop across a mesh, then the new page loads at its destination */
const Route=(()=>{
  const cv=document.getElementById('route'), tag=document.getElementById('routetag'), x=cv.getContext('2d');
  let W,H,nodes=[],edges=[];
  function build(){
    const d=Math.min(devicePixelRatio,2); W=innerWidth; H=innerHeight; cv.width=W*d; cv.height=H*d; x.setTransform(d,0,0,d,0,0);
    nodes=[]; const cols=W<700?4:7, rows=W<700?6:4;
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++) nodes.push({x:(c+.5)/cols*W+(Math.random()-.5)*W/cols*.55, y:(r+.5)/rows*H+(Math.random()-.5)*H/rows*.5, c, r});
    edges=[]; nodes.forEach((a,i)=>nodes.forEach((b,j)=>{ if(j<=i) return; const dc=Math.abs(a.c-b.c), dr=Math.abs(a.r-b.r); if(dc+dr===1||(dc===1&&dr===1&&Math.random()<.35)) edges.push([i,j]); }));
  }
  function path(from,to){ // BFS over the mesh
    const adj=nodes.map(()=>[]); edges.forEach(([a,b])=>{adj[a].push(b);adj[b].push(a)});
    const prev=Array(nodes.length).fill(-1), q=[from], seen=new Set([from]);
    while(q.length){const v=q.shift(); if(v===to) break; for(const w of adj[v].sort(()=>Math.random()-.5)) if(!seen.has(w)){seen.add(w);prev[w]=v;q.push(w);}}
    const p=[]; for(let v=to;v!==-1;v=prev[v]) p.unshift(v); return p;
  }
  function run(fromName,toName,swap){
    if(reduce){ swap(); return; }
    build(); const cols=W<700?4:7, rows=W<700?6:4;
    const start=nodes.findIndex(n=>n.c===0&&n.r===Math.floor(Math.random()*rows)), end=nodes.findIndex(n=>n.c===cols-1&&n.r===Math.floor(Math.random()*rows));
    const p=path(start<0?0:start,end<0?nodes.length-1:end); const hops=p.length-1;
    tag.innerHTML=`route <b>/${fromName}</b> → <b>/${toName}</b> · ${hops} hops`; tag.classList.add('on'); cv.classList.add('on');
    const t0=performance.now(), dur=760; let swapped=false;
    const segLen=[]; let total=0; for(let i=1;i<p.length;i++){const a=nodes[p[i-1]],b=nodes[p[i]];const l=Math.hypot(b.x-a.x,b.y-a.y);segLen.push(l);total+=l;}

function scramble(el){ if(!el||reduce) return; const final=el.dataset.text||el.textContent; el.dataset.text=final; const glyphs='!<>-_\\/[]{}=+*^?#01';
  let f=0; const total=22; const tick=()=>{ el.textContent=final.split('').map((ch,i)=>{ if(ch===' ') return ' '; return i < f/total*final.length ? ch : glyphs[(Math.random()*glyphs.length)|0]; }).join(''); f++; if(f<=total) requestAnimationFrame(tick); else el.textContent=final; }; tick(); }

const revIO = ('IntersectionObserver' in window && !reduce) ? new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.remove('pre'); revIO.unobserve(e.target); } }),{rootMargin:'0px 0px -8% 0px'}) : null;
function reveals(){ if(!revIO) return; document.querySelectorAll('main .glass, main .h2, main .marq').forEach((el,i)=>{ if(el.classList.contains('rv')) return; el.classList.add('rv');
  const r=el.getBoundingClientRect(); if(r.top>innerHeight*.92){ el.classList.add('pre'); el.style.transitionDelay=(i%4)*60+'ms'; revIO.observe(el); } }); }

const LinkUp = {

    make(){const n=this.n; this.win=false; this.moves=0;
      const sr=Math.floor(Math.random()*n), dr=Math.floor(Math.random()*n); this.src=sr*n; this.dst=dr*n+n-1;
      // random monotone-ish path from left to right
      let r=sr,c=0; const path=[[r,c]];
      while(c<n-1){ const opts=[]; opts.push([r,c+1]); if(r>0)opts.push([r-1,c]); if(r<n-1)opts.push([r+1,c]);
        let nx=opts[Math.floor(Math.random()*opts.length)]; if(path.some(p=>p[0]===nx[0]&&p[1]===nx[1])) nx=[r,c+1]; [r,c]=nx; path.push([r,c]); }
      while(r!==dr){ r+= dr>r?1:-1; path.push([r,c]); }
      const need=Array(n*n).fill(null).map(()=>new Set());

      for(let i=1;i<path.length;i++){const[a,b]=path[i-1],[x,y]=path[i];const A=a*n+b,B=x*n+y;

    <p class="sub">A break between reading. Both are built from everyday network work.</p>
    <div class="games"><Subnet/><LinkUp/></div></div>`
};

/* ---------- endorsements ---------- */
const Endorse = {
  template:`<div class="wrap page"><span class="kicker"><i></i>Reviewed before publishing</span><h1 class="title" data-scr>Endorse</h1>
    <p class="sub">Worked with me? Leave a few lines. Every endorsement is checked by me before it appears here.</p>
    <div class="grid2">
      <div><h2 class="h2" style="font-size:clamp(24px,3vw,36px)">Endorsements</h2>
        <div class="wall" v-if="list.length"><figure class="quote glass" v-for="e in list" :key="e.id" style="margin:0 0 14px"><p>“{{e.message}}”</p>
          <footer><b>{{e.name}}</b>{{[e.role,e.company].filter(Boolean).join(', ')}}<template v-if="e.relation"> · {{e.relation}}</template></footer></figure></div>
        <div class="empty" v-else style="margin-top:20px">No endorsements published yet. Yours could be the first.</div>
      </div>
      <form class="card glass" @submit.prevent="send" novalidate>
        <div class="split"><div class="field"><label for="en">Your name</label><input id="en" v-model.trim="f.name" required maxlength="80" autocomplete="name"></div>
        <div class="field"><label for="er">Role</label><input id="er" v-model.trim="f.role" maxlength="80" autocomplete="organization-title"></div></div>
        <div class="split"><div class="field"><label for="ec">Company</label><input id="ec" v-model.trim="f.company" maxlength="80" autocomplete="organization"></div>
        <div class="field"><label for="ex">How we worked together</label><select id="ex" v-model="f.relation"><option value="">Choose one</option><option>Colleague</option><option>Manager</option><option>Customer</option><option>Partner</option><option>Classmate</option><option>Other</option></select></div></div>
        <div class="field"><label for="el">LinkedIn profile (optional, not shown publicly)</label><input id="el" v-model.trim="f.link" maxlength="200" inputmode="url"></div>
        <div class="field"><label for="em">Endorsement</label><textarea id="em" v-model.trim="f.message" required maxlength="800"></textarea></div>
        <input type="text" v-model="f.website" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px">
        <button class="btn hot" type="submit" :disabled="busy">Submit for review</button>
        <p class="note" :class="msgClass" aria-live="polite">{{msg}}</p>
        <p class="preview-flag" v-if="!$root.s.backend">Preview mode: submissions are not sent from this preview. They work on the live site.</p>
      </form>
    </div></div>`,
  data(){return{f:{name:'',role:'',company:'',relation:'',link:'',message:'',website:''},list:[],busy:false,msg:'',msgClass:''}},
  async created(){ try{ this.list=await api('endorsements')||[]; }catch(e){} },
  methods:{async send(){ if(!this.f.name||this.f.message.length<20){this.msg='Add your name and at least a sentence or two.';this.msgClass='err';return;}
    if(!state.backend){ this.msg='This preview cannot send. Use the live site.'; this.msgClass='err'; return; }
    this.busy=true; try{ await api('endorsements',{method:'POST',json:this.f});
      this.msg='Thank you. Your endorsement is waiting for review.'; this.msgClass='ok'; this.f={name:'',role:'',company:'',relation:'',link:'',message:'',website:''};
    }catch(e){ this.msg=e.message||'Your endorsement could not be saved. Try again.'; this.msgClass='err'; } this.busy=false; }}
};

/* ---------- contact + CV ---------- */
const Contact = {
  template:`<div class="wrap page"><span class="kicker"><i></i>Replies within a day</span><h1 class="title" data-scr>Contact</h1>
    <p class="sub">Feedback, a role, or a project. Send it straight to my WhatsApp or my inbox.</p>
    <div class="grid2">
      <form class="card glass" @submit.prevent="email" novalidate>
        <div class="seg" role="group" aria-label="Message type"><button type="button" v-for="k in kinds" :key="k" :aria-pressed="f.kind===k" @click="f.kind=k">{{k}}</button></div>
        <div class="split"><div class="field"><label for="cn">Your name</label><input id="cn" v-model.trim="f.name" required autocomplete="name"></div>
        <div class="field"><label for="ce">Your email</label><input id="ce" v-model.trim="f.email" type="email" autocomplete="email"></div></div>
        <div class="field"><label for="cm">Message</label><textarea id="cm" v-model.trim="f.message" required></textarea></div>
        <input type="text" v-model="f.website" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px">
        <div class="row" style="margin-top:4px">
          <a class="btn hot" :href="wa" target="_blank" rel="noopener" @click="waClick">Send on WhatsApp</a>
          <button class="btn line" type="submit" :disabled="busy">Send by email</button>
        </div>
        <p class="note" :class="msgClass" aria-live="polite">{{msg}}</p>
      </form>
      <div>
        <div class="cline"><div><small>Email</small><span class="v" id="c-em">{{S.email}}</span></div><button class="mini" type="button" @click="copy('c-em',$event)">Copy</button></div>
        <div class="cline"><div><small>Phone and WhatsApp</small><span class="v" id="c-ph">{{S.phone}}</span></div><button class="mini" type="button" @click="copy('c-ph',$event)">Copy</button></div>
        <div class="cline"><div><small>LinkedIn</small><span class="v">in/nuwan-sayuru</span></div><a class="mini" :href="S.linkedin" target="_blank" rel="noopener">Open</a></div>
        <div class="cline"><div><small>GitHub</small><span class="v">@{{S.github}}</span></div><a class="mini" :href="'https://github.com/'+S.github" target="_blank" rel="noopener">Open</a></div>
      </div>
    </div>
    <div class="cvbox glass" id="cv"><div><h3>Curriculum vitae</h3><p>{{cv.updated ? 'Updated '+cv.updated+'.' : 'The latest version of my CV.'}}</p></div>
      <a v-if="cv.url" class="btn hot" :href="cv.url" target="_blank" rel="noopener">Open CV (PDF)</a>
      <a v-else class="btn line" :href="wa2" target="_blank" rel="noopener">Request my CV on WhatsApp</a></div>
  </div>`,
  data(){return{S,kinds:['Feedback','Job opportunity','Project request','Other'],f:{kind:'Job opportunity',name:'',email:'',message:'',website:''},busy:false,msg:'',msgClass:''}},
  computed:{
    cv(){return state.content.cv||{}},
    text(){return `${this.f.kind} from ${this.f.name||'(name)'}${this.f.email?' <'+this.f.email+'>':''}:\n\n${this.f.message}`},
    wa(){return `https://wa.me/${S.whatsapp}?text=${encodeURIComponent('Hi Nuwan, '+this.text)}`},
    wa2(){return `https://wa.me/${S.whatsapp}?text=${encodeURIComponent('Hi Nuwan, could you share your latest CV?')}`}
  },
  methods:{
    waClick(e){ if(!this.f.name||!this.f.message){ e.preventDefault(); this.msg='Add your name and a message first.'; this.msgClass='err'; return; } this.log(); this.msg='WhatsApp opened with your message. Press send there.'; this.msgClass='ok'; },
    async log(){ if(state.backend){ try{ await api('messages',{method:'POST',json:this.f}); }catch(e){} } },
    async email(){ if(!this.f.name||!this.f.message){ this.msg='Add your name and a message first.'; this.msgClass='err'; return; }
      this.busy=true;
      try{
        if(S.web3formsKey){ const r=await fetch('https://api.web3forms.com/submit',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({access_key:S.web3formsKey,subject:`Portfolio: ${this.f.kind} from ${this.f.name}`,from_name:this.f.name,replyto:this.f.email,message:this.text,botcheck:this.f.website})});
          const j=await r.json(); if(!j.success) throw new Error('mail'); }
        else if(!state.backend) throw new Error('none');
        await this.log(); this.msg='Sent. I will reply to the address you gave.'; this.msgClass='ok'; this.f.message='';
      }catch(e){ this.msg='The message could not be sent from here. Use WhatsApp, or copy my email address.'; this.msgClass='err'; }
      this.busy=false; },
    copy(id,e){ const el=document.getElementById(id), b=e.currentTarget; const sel=()=>{const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent='Selected';};
      try{ navigator.clipboard.writeText(el.textContent).then(()=>{b.textContent='Copied';setTimeout(()=>b.textContent='Copy',1500)},sel);}catch(err){sel();} }
  }
};

/* ---------- admin ---------- */
const Admin = {
  template:`<div class="wrap page"><h1 class="title" data-scr>Admin</h1>
    <div v-if="!$root.s.backend" class="card glass" style="margin-top:24px"><p>The admin page works on the live site only.</p></div>
    <form v-else-if="!signed" class="card glass" style="margin-top:24px;max-width:480px" @submit.prevent="login">
      <input type="text" name="username" value="admin" autocomplete="username" hidden>
      <div class="field"><label for="ap">Admin password</label><input id="ap" v-model="ap" type="password" autocomplete="current-password"></div>
      <button class="btn hot" type="submit">Sign in</button><p class="note err">{{err}}</p></form>
    <div v-else>
      <div class="tabsx seg"><button v-for="t in tabs" :key="t" type="button" :aria-pressed="tab===t" @click="tab=t;load()">{{t}}</button><button type="button" @click="logout">Sign out</button></div>
      <div v-if="tab==='Endorsements'"><div class="item" v-for="e in ends" :key="e.id"><b>{{e.name}}</b> <small>({{e.status}}) {{[e.role,e.company,e.relation].filter(Boolean).join(', ')}} {{e.link}} · {{e.created_at}}</small><p style="margin-top:8px">{{e.message}}</p>
        <div class="acts"><button class="mini" type="button" @click="setStatus(e,'approved')">Approve</button><button class="mini" type="button" @click="setStatus(e,'rejected')">Reject</button><button class="mini" type="button" @click="del('endorsements',e)">Delete</button></div></div><p v-if="!ends.length" class="note">Nothing here.</p></div>
      <div v-if="tab==='Messages'"><div class="item" v-for="m in msgs" :key="m.id"><b>{{m.kind}}</b> from {{m.name}} <small>{{m.email}} · {{m.created_at}}</small><p style="margin-top:8px;white-space:pre-wrap">{{m.message}}</p><div class="acts"><button class="mini" type="button" @click="del('messages',m)">Delete</button></div></div><p v-if="!msgs.length" class="note">No messages.</p></div>
      <div v-if="tab==='Content'"><p class="note">Edit any text, number or list, then save. Every visitor sees the change straight away.</p><textarea class="code" v-model="json" spellcheck="false" aria-label="Site content"></textarea>
        <div class="row"><button class="btn hot" type="button" @click="saveContent">Save content</button><button class="btn line" type="button" @click="json=JSON.stringify(def,null,2)">Load defaults</button></div><p class="note" :class="okc">{{cmsg}}</p></div>
      <div v-if="tab==='CV'"><div class="card glass" style="display:grid;gap:18px">
        <div><p><b>CV (PDF)</b> {{$root.s.content.cv&&$root.s.content.cv.updated?'· current: '+$root.s.content.cv.updated:''}}</p><input type="file" accept="application/pdf" @change="e=>upload('cv',e)" aria-label="Upload CV"></div>
        <p class="note" :class="okc">{{cmsg}}</p></div></div>
      <div v-if="tab==='Password'"><form class="card glass" style="max-width:480px" @submit.prevent="changePw">
        <div class="field"><label for="pc">Current password</label><input id="pc" v-model="pw.current" type="password" autocomplete="current-password"></div>
        <div class="field"><label for="pn">New password (12+ characters)</label><input id="pn" v-model="pw.next" type="password" autocomplete="new-password"></div>
        <button class="btn hot" type="submit">Change password</button><p class="note" :class="okc">{{cmsg}}</p></form></div>
    </div></div>`,
  data(){return{signed:!!store.get('ns-admin',null),ap:'',err:'',tabs:['Endorsements','Messages','Content','CV','Password'],tab:'Endorsements',ends:[],msgs:[],json:'',cmsg:'',okc:'',pw:{current:'',next:''},def:window.CONTENT_DEFAULT}},
  created(){ if(this.signed) this.load(); },
  methods:{
    fail(e){ if(/Sign in again/.test(e.message)){ store.del('ns-admin'); this.signed=false; } this.cmsg=e.message; this.okc='err'; },
    async login(){ try{ const d=await api('admin/login',{method:'POST',json:{password:this.ap}}); store.set('ns-admin',d.token); this.signed=true; this.ap=''; this.err=''; this.load(); }catch(e){ this.err=e.message; } },
    async logout(){ try{ await api('admin/logout',{method:'POST',json:{}}); }catch(e){} store.del('ns-admin'); this.signed=false; },
    async load(){ this.cmsg=''; try{
      if(this.tab==='Endorsements') this.ends=await api('admin/endorsements');
      if(this.tab==='Messages') this.msgs=await api('admin/messages');
      if(this.tab==='Content'){ const d=await api('content'); this.json=JSON.stringify(merge(window.CONTENT_DEFAULT,d.data||{}),null,2); }
    }catch(e){ this.fail(e); } },
    async setStatus(e,s){ try{ await api('admin/endorsements/'+e.id,{method:'PATCH',json:{status:s}}); e.status=s; }catch(x){ this.fail(x); } },
    async del(kind,e){ try{ await api(`admin/${kind}/`+e.id,{method:'DELETE'}); if(kind==='endorsements') this.ends=this.ends.filter(x=>x.id!==e.id); else this.msgs=this.msgs.filter(x=>x.id!==e.id); }catch(x){ this.fail(x); } },
    async saveContent(){ let d; try{ d=JSON.parse(this.json); }catch(e){ this.cmsg='That is not valid JSON: '+e.message; this.okc='err'; return; }
      try{ await api('admin/content',{method:'PUT',json:{data:d}}); state.content=merge(window.CONTENT_DEFAULT,d); this.cmsg='Saved. The site now shows these changes.'; this.okc='ok'; }catch(e){ this.fail(e); } },
    async upload(kind,ev){ const f=ev.target.files[0]; if(!f) return; this.cmsg='Uploading…'; this.okc='';
      try{ const r=await fetch('/api/admin/file/'+kind,{method:'PUT',headers:{'content-type':f.type,authorization:'Bearer '+store.get('ns-admin','')},body:f}); const d=await r.json(); if(!r.ok) throw new Error(d.error);
        state.content=merge(state.content,{[kind]:{url:d.url,updated:d.updated}}); this.cmsg=(kind==='cv'?'CV':'Photo')+' published.'; this.okc='ok'; }catch(e){ this.fail(e); } },
    async changePw(){ try{ await api('admin/password',{method:'POST',json:this.pw}); this.pw={current:'',next:''}; this.cmsg='Password changed.'; this.okc='ok'; }catch(e){ this.fail(e); } }
  }
};

/* ---------- terminal easter egg ---------- */
const Term = {
  template:`<div><button v-if="!$root.s.term" class="tbtn" type="button" aria-label="Open terminal" @click="open">&gt;_</button>
  <section v-else class="term glass" aria-label="Terminal"><header><span><i style="background:var(--ember)"></i><i style="background:var(--gold)"></i><i style="background:var(--magenta)"></i></span><span>guest@nuwan-sayuru</span><button class="mini" type="button" @click="$root.s.term=false">Close</button></header>
    <div class="out" ref="out"><div v-for="(l,i) in lines" :key="i" :class="l.c">{{l.t}}</div></div>
    <form @submit.prevent="run"><span style="color:var(--gold)">$</span><input ref="inp" v-model="cmd" aria-label="Command" autocomplete="off" spellcheck="false"></form></section></div>`,
  data(){return{cmd:'',lines:[{t:'Type help to list commands.'}]}},
  methods:{
    open(){this.$root.s.term=true;this.$nextTick(()=>this.$refs.inp&&this.$refs.inp.focus())},
    say(t,c){this.lines.push({t,c})},
    run(){const c=this.cmd.trim().toLowerCase();this.say('$ '+this.cmd,'c');this.cmd='';const C=state.content;
      const go=r=>{this.$root.go(r);this.say('Opening '+r+'.');};
      const map={
        help:()=>this.say('whoami  stats  skills  services  github  cv  work  play  endorse  contact  burst  clear'),
        whoami:()=>this.say(`Nuwan Sayuru\n${C.role}\n${C.basedIn}`),
        stats:()=>this.say(C.stats.map(s=>`${s.v.padEnd(6)} ${s.l}`).join('\n')),
        skills:()=>this.say(C.domains.map(d=>`${d.t}: ${d.k.join(', ')}`).join('\n')),
        services:()=>this.say(C.services.map(s=>'- '+s.t).join('\n')),
        github:()=>{window.open?.('https://github.com/'+S.github,'_blank');this.say('github.com/'+S.github);},
        cv:()=>{this.$root.go('contact',null,'cv');this.say('Opening the CV section.');},
        work:()=>go('work'),play:()=>go('play'),endorse:()=>go('endorse'),contact:()=>go('contact'),
        burst:()=>{Field.burst&&Field.burst();this.say('Scattered.');},
        clear:()=>{this.lines=[];},
        sudo:()=>this.say('Nice try.'),
      };
      (map[c]||(()=>this.say(c?`${c}: command not found. Type help.`:'')))();
      this.$nextTick(()=>{const o=this.$refs.out;if(o)o.scrollTop=o.scrollHeight;});}
  }
};

const App = {
  components:{Nav,Home,Work,Code,Play,Endorse,Contact,Admin,Term},
  template:`<Nav :route="s.route"/><main :key="s.route"><component :is="view"/></main>
    <footer class="foot"><div class="wrap"><span>© {{year}} Nuwan Sayuru</span><span><a :href="S.linkedin" target="_blank" rel="noopener">LinkedIn</a> · <a :href="'https://github.com/'+S.github" target="_blank" rel="noopener">GitHub</a></span></div></footer><Term/>`,
  data(){return{s:state,S,year:new Date().getFullYear()}},
  computed:{view(){return {home:'Home',work:'Work',code:'Code',play:'Play',endorse:'Endorse',contact:'Contact',admin:'Admin'}[this.s.route]||'Home'}},
  methods:{
    go(r,e,anchor){ if(e) e.preventDefault(); state.menu=false;
      if(r===state.route){ this.after(anchor); return; }
      const from=state.route;
      Route.run(from,r,()=>{ state.route=r; try{history.replaceState(null,'','#'+r)}catch(_){location.hash=r} Field.to(ROUTES[r]||'sphere'); scrollTo({top:0,behavior:'instant'}); this.after(anchor); }); },
    after(anchor){ document.getElementById('horizon').classList.toggle('dim',state.route!=='home');
      nextTick(()=>{ document.querySelectorAll('[data-scr]').forEach(scramble); reveals(); countUp(); if(anchor){ const el=document.getElementById(anchor); el&&el.scrollIntoView({behavior:reduce?'auto':'smooth',block:'center'}); } }); }
  },
  mounted(){ const h=(location.hash||'').slice(1); if(h&&(ROUTES[h]||h==='admin')){ state.route=h; Field.to(ROUTES[h]||'sphere'); } this.after();
    addEventListener('keydown',e=>{ if((e.key==='~'||e.key==='`')&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){ e.preventDefault(); state.term=!state.term; }});
    addEventListener('hashchange',()=>{const h=location.hash.slice(1); if(h&&h!==state.route&&(ROUTES[h]||h==='admin')) this.go(h);});
  }
};
createApp(App).mount('#app');
loadContent().then(()=>{ loadRepos(); nextTick(()=>{ reveals(); }); });
})();
</script>
