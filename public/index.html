@font-face{font-family:"Anybody";src:url(/fonts/anybody.woff2) format("woff2");font-weight:100 900;font-stretch:50% 150%;font-display:swap}

@font-face{font-family:"Schibsted Grotesk";src:url(/fonts/sg-600.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Schibsted Grotesk";src:url(/fonts/sg-700.woff2) format("woff2");font-weight:700;font-display:swap}

/* Layout: one fixed WebGL particle field behind a hash-routed multi-page app. The cloud re-forms
   into a new shape on every page: name, sphere, lattice, knot, ring, wave. Warm neon on black. */
:root{
  --bg:#07090c;
  --panel:#0d1116;
  --line:#1e252e;
  --text:#eef0f2;
  --dim:#8f99a3;
  --gold:#e8b86b;      /* champagne gold: primary accent */
  --ember:#c8734a;     /* copper: rare */
  --magenta:#2ec4b6;   /* aqua teal: glow and signal */
  --violet:#1b6f69;
  --heat:linear-gradient(100deg,#2ec4b6,#e8b86b);
  --f-display:"Anybody","Arial Black",system-ui,sans-serif;
  --f-body:"Schibsted Grotesk","Helvetica Neue",Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --gut:clamp(16px,4vw,56px);
  --max:1240px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--text);font-family:var(--f-body);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}
#field{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
#app{position:relative;z-index:1}
.wrap{max-width:var(--max);margin-inline:auto;padding-inline:var(--gut)}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:.95;text-wrap:balance}
p{margin:0}
.grad{background:var(--heat);-webkit-background-clip:text;background-clip:text;color:transparent}
.glass{background:color-mix(in srgb,var(--panel) 72%,transparent);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);border:1px solid var(--line)}

/* nav */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(7,9,12,.72);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--f-display);font-weight:800;font-variation-settings:"wdth" 140;font-size:15px;letter-spacing:.04em}
.logo b{width:30px;height:30px;border-radius:9px;background:var(--heat);display:grid;place-items:center;color:#000;font-size:12px;letter-spacing:0;font-variation-settings:"wdth" 100;flex:none}
.links{display:flex;gap:4px;padding:5px;border-radius:999px}
.links a{text-decoration:none;font-size:14.5px;padding:8px 14px;border-radius:999px;color:var(--dim);transition:color .2s,background .2s}
.links a:hover{color:var(--text)}
.links a.on{background:var(--text);color:#000;font-weight:600}
.cvbtn{text-decoration:none;font-weight:700;font-size:14px;padding:10px 18px;border-radius:999px;background:transparent;border:1px solid var(--gold);color:var(--gold);white-space:nowrap}
.menu{display:none;align-items:center;gap:8px;border:1px solid var(--line);background:#121820;color:var(--text);border-radius:999px;padding:9px 14px;cursor:pointer;font-size:14px;font-weight:600}
.menu .bars{display:grid;gap:4px;width:16px}
.menu .bars i{display:block;height:2px;border-radius:2px;background:var(--gold);transition:transform .25s,opacity .25s}
.menu[aria-expanded="true"] .bars i:nth-child(1){transform:translateY(6px) rotate(45deg)}
.menu[aria-expanded="true"] .bars i:nth-child(2){opacity:0}
.menu[aria-expanded="true"] .bars i:nth-child(3){transform:translateY(-6px) rotate(-45deg)}
.scrim{display:none}
@media (max-width:900px){
  .menu{display:inline-flex}
  .links{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));left:12px;right:12px;z-index:31;flex-direction:column;gap:2px;padding:10px;border-radius:20px;
    background:#0f141b;border:1px solid #2a333e;box-shadow:0 24px 60px -10px rgba(0,0,0,.85),0 0 0 1px rgba(46,196,182,.08);backdrop-filter:none;-webkit-backdrop-filter:none;
    display:none;opacity:0;transform:translateY(-8px);transition:opacity .2s,transform .2s}
  .links.open{display:flex;opacity:1;transform:none}
  .links a{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;font-size:17px;font-weight:600;color:#e6e9ec;border-radius:12px}
  .links a::after{content:"";width:8px;height:8px;border-top:2px solid #5d6976;border-right:2px solid #5d6976;transform:rotate(45deg)}
  .links a:hover,.links a:focus-visible{background:#18202a;color:#fff}
  .links a.on{background:linear-gradient(90deg,rgba(232,184,107,.16),rgba(46,196,182,.06));color:var(--gold);box-shadow:inset 3px 0 0 var(--gold)}
  .links a.on::after{border-color:var(--gold)}
  .scrim{display:block;position:fixed;inset:0;z-index:29;background:rgba(3,5,8,.72);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
}

/* page frame */
.page{padding-block:clamp(28px,5vw,64px) clamp(64px,8vw,120px)}
.kicker{display:inline-flex;align-items:center;gap:10px;font-size:14px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 8px}
.kicker i{width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px var(--gold);animation:blink 2s infinite}
@keyframes blink{50%{opacity:.35}}
.title{font-size:clamp(46px,8.4vw,128px);font-weight:900;font-variation-settings:"wdth" 120;text-transform:uppercase;letter-spacing:-.01em;margin-top:18px}
.sub{max-width:52ch;color:var(--dim);font-size:clamp(17px,1.6vw,20px);margin-top:18px}
.block{margin-top:clamp(56px,8vw,112px)}
.h2{font-size:clamp(30px,4.2vw,56px);font-weight:850;font-variation-settings:"wdth" 110;text-transform:uppercase}
.h2+p{color:var(--dim);margin-top:10px;max-width:56ch}

/* hero */
.hero{min-height:calc(100svh - 70px);display:grid;align-content:end;padding-bottom:clamp(28px,5vw,56px)}
.row{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
.btn{position:relative;display:inline-flex;align-items:center;gap:10px;padding:15px 24px;border-radius:999px;font-weight:700;font-size:15px;text-decoration:none;border:1.5px solid var(--text);background:transparent;cursor:pointer;transition:background .25s,color .25s,box-shadow .25s;will-change:transform}
.btn.hot{background:linear-gradient(100deg,#f3d7a4,#e8b86b);border-color:transparent;color:#07090c;box-shadow:0 10px 40px -14px rgba(232,184,107,.6)}
.btn.hot:hover{background:linear-gradient(100deg,#a9efe7,#2ec4b6);border-color:transparent;box-shadow:0 14px 50px -10px rgba(232,184,107,.8)}
.btn.line:hover{background:var(--text);color:#000}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.hint{margin-top:22px;font-size:13px;color:var(--dim);display:flex;align-items:center;gap:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.fallname{display:none;font-family:var(--f-display);font-weight:900;font-variation-settings:"wdth" 125;font-size:clamp(56px,11vw,150px);line-height:.85;text-transform:uppercase;background:var(--heat);-webkit-background-clip:text;background-clip:text;color:transparent}
.nogl .fallname{display:block}
@media (pointer:coarse){.hint{display:none}.tbtn{width:44px;height:44px;opacity:.8}}
.hint kbd{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-bottom-width:3px;border-radius:6px;padding:1px 7px;color:var(--text)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));border-radius:26px;overflow:hidden}
.stat{padding:26px 22px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0}
.stat b{display:block;font-family:var(--f-display);font-weight:900;font-variation-settings:"wdth" 82;font-size:clamp(32px,3.6vw,52px);white-space:nowrap;line-height:1;font-variant-numeric:tabular-nums}
.stat span{display:block;margin-top:10px;color:var(--dim);font-size:14.5px;line-height:1.35}

/* services */
.svc{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px;margin-top:28px}
.svc div{padding:22px;border-radius:20px;min-width:0}
.svc h3{font-family:var(--f-body);font-size:19px;font-weight:700;line-height:1.25}
.svc p{color:var(--dim);margin-top:8px;font-size:15.5px}
.svc .ix{font-family:var(--f-mono);font-size:12px;color:var(--gold);margin-bottom:12px;display:block}

/* domains: glow cards with tilt */
.doms{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px;margin-top:28px}
.dom{position:relative;border-radius:24px;padding:26px;min-height:220px;overflow:hidden;transform-style:preserve-3d;transition:transform .2s ease-out;isolation:isolate}
.dom::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;background:conic-gradient(from var(--a,0deg),transparent 0 70%,var(--c1) 80%,var(--c2) 90%,transparent);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.0;transition:opacity .4s;z-index:-1}
.dom:hover::before,.dom:focus-within::before{opacity:1;animation:spin 3s linear infinite}
@property --a{syntax:"<angle>";initial-value:0deg;inherits:false}
@keyframes spin{to{--a:360deg}}
.dom::after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;left:var(--mx,50%);top:var(--my,50%);translate:-50% -50%;background:radial-gradient(circle,color-mix(in srgb,var(--c1) 30%,transparent),transparent 65%);opacity:0;transition:opacity .3s;z-index:-1;pointer-events:none}
.dom:hover::after{opacity:1}
.dom h3{font-size:26px;font-weight:850;font-variation-settings:"wdth" 115;text-transform:uppercase;line-height:1}
.dom p{color:var(--dim);margin-top:12px;font-size:15.5px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.tags span{font-size:12.5px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--text);background:#ffffff08}

/* stack map */
.stack{display:grid;gap:14px;margin-top:30px}
.layer{display:grid;grid-template-columns:minmax(0,230px) minmax(0,1fr);gap:16px 28px;padding:22px 0;border-top:1px solid var(--line);position:relative}
.layer::before{content:"";position:absolute;left:0;top:-1px;width:120px;height:1px;background:var(--c1);box-shadow:0 0 14px var(--c1)}
.lh{display:flex;flex-direction:column;gap:6px;align-self:start;position:sticky;top:90px}
.lh .ln{font-family:var(--f-mono);font-size:12px;color:var(--c1)}
.lh h3{overflow-wrap:anywhere;font-size:clamp(22px,2.3vw,30px);font-weight:850;font-variation-settings:"wdth" 115;text-transform:uppercase;line-height:1}
.lh .lc{font-size:13px;color:var(--dim)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:12px}
.dom.sm{min-height:0;padding:20px 18px}
.dom.sm .topo{width:72px;height:48px;right:10px;top:10px;opacity:.75}
.dom.sm h4{font-family:var(--f-body);font-size:18px;font-weight:700;line-height:1.2;max-width:calc(100% - 70px)}
.dom.sm p{font-size:14.5px;margin-top:8px;max-width:none}
.dom.sm .tags{margin-top:12px}
.dom.sm .tags span{font-size:12px;padding:3px 9px}
@media (max-width:760px){.layer{grid-template-columns:1fr}.lh{position:static;flex-direction:row;align-items:baseline;gap:12px}}
@media (max-width:560px){
  .tiles{grid-template-columns:1fr 1fr;gap:8px}
  .dom.sm{padding:14px 12px}
  .dom.sm .topo,.dom.sm p{display:none}
  .dom.sm h4{max-width:none;font-size:15.5px}
  .dom.sm .tags{margin-top:8px;gap:4px}
  .dom.sm .tags span{font-size:11px;padding:2px 7px}
  .dom.sm .tags span:nth-child(n+3){display:none}
}

/* marquee */
.marq{overflow:hidden;border-block:1px solid var(--line);padding-block:18px;margin-top:clamp(56px,8vw,112px);mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.marq div{display:flex;gap:48px;width:max-content;animation:slide 40s linear infinite}
.marq span{font-family:var(--f-display);font-weight:800;font-variation-settings:"wdth" 130;font-size:clamp(22px,3vw,38px);text-transform:uppercase;white-space:nowrap;color:transparent;-webkit-text-stroke:1px var(--dim)}
.marq span:nth-child(3n+1){-webkit-text-stroke:0;color:var(--gold)}
@keyframes slide{to{transform:translateX(-50%)}}

/* highlights */
.hl{display:grid;gap:12px;margin-top:28px}
.hl details{border-radius:20px;overflow:hidden}
.hl summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;align-items:center;padding:22px 24px}
.hl summary::-webkit-details-marker{display:none}
.hl summary .n{font-family:var(--f-display);font-weight:900;font-variation-settings:"wdth" 100;font-size:clamp(28px,3.4vw,44px);line-height:1;min-width:3.2ch}
.hl summary h3{font-family:var(--f-body);font-weight:700;font-size:clamp(18px,1.8vw,22px);line-height:1.25}
.hl summary small{display:block;color:var(--dim);font-size:14px;font-weight:400;margin-top:2px}
.hl summary .pm{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;transition:transform .3s,background .3s}
.hl details[open] .pm{transform:rotate(45deg);background:var(--text);color:#000}
.hl .body{padding:0 24px 24px;color:#e9ddd8;max-width:80ch}
@media (max-width:560px){.hl summary{grid-template-columns:minmax(0,1fr) auto}.hl summary .n{grid-column:1/-1}}

/* timeline */
.tl{display:grid;gap:12px;margin-top:28px}
.tl div{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr);gap:8px 24px;padding:22px 24px;border-radius:20px}
.tl time{font-family:var(--f-mono);font-size:14px;color:var(--gold)}
.tl h3{font-family:var(--f-body);font-size:20px;font-weight:700;line-height:1.3}
.tl p{color:var(--dim);margin-top:4px}
@media (max-width:640px){.tl div{grid-template-columns:1fr}}

/* credentials */
.creds{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:12px;margin-top:28px}
.cred{padding:24px;border-radius:22px;min-width:0;position:relative;overflow:hidden}
.cred .big{font-family:var(--f-display);font-weight:900;font-variation-settings:"wdth" 120;font-size:30px;text-transform:uppercase;line-height:1}
.cred p{color:var(--dim);margin-top:10px;font-size:15px}
.cred small{display:block;font-family:var(--f-mono);font-size:12px;color:var(--gold);margin-bottom:12px}
.cred.star{background:radial-gradient(120% 100% at 100% 0%,rgba(232,184,107,.16),transparent 60%),var(--panel);border-color:rgba(232,184,107,.35)}

/* github */
.repos{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px;margin-top:28px}
.repo{display:flex;flex-direction:column;gap:10px;padding:22px;border-radius:20px;text-decoration:none;min-width:0;transition:transform .25s,border-color .25s}
.repo:hover{transform:translateY(-4px);border-color:var(--gold)}
.repo h3{font-family:var(--f-mono);font-size:17px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.repo p{color:var(--dim);font-size:15px;flex:1}
.repo .meta{display:flex;gap:14px;font-size:13px;color:var(--dim)}
.repo .meta i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.ghcard{display:flex;flex-wrap:wrap;align-items:center;gap:18px;padding:22px;border-radius:22px;margin-top:28px}
.ghcard .who{font-family:var(--f-mono);font-size:18px;font-weight:600}
.ghcard p{color:var(--dim);font-size:15px}
.ghcard .sp{flex:1;min-width:200px}

/* forms */
.grid2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:clamp(16px,3vw,32px);margin-top:28px;align-items:start}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.card{padding:clamp(20px,3vw,32px);border-radius:24px;min-width:0}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-size:14px;color:var(--dim)}
.field input,.field select,.field textarea{width:100%;background:#00000080;border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--text);font:inherit;font-size:16px}
.field textarea{min-height:130px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 25%,transparent)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.split{grid-template-columns:1fr}}
.seg{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.seg button{padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--text);color:#000;border-color:var(--text);font-weight:600}
.note{font-size:14px;color:var(--dim);margin-top:12px}
.ok{color:#ffd28a}
.err{color:#ff8a78}
.cline{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 18px;border-radius:16px;border:1px solid var(--line);background:#00000066;margin-bottom:10px}
.cline small{display:block;color:var(--dim);font-size:13px}
.cline .v{font-weight:600;overflow-wrap:anywhere;user-select:all}
.cline > div{min-width:0}
.mini{padding:8px 14px;border-radius:999px;border:1px solid var(--text);background:transparent;cursor:pointer;font-size:13px;font-weight:600;text-decoration:none;flex-shrink:0}

/* endorsements wall */
.wall{columns:3 280px;column-gap:14px;margin-top:20px}
.quote{break-inside:avoid;margin-bottom:14px;padding:22px;border-radius:20px}
